<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>圖片轉文字工具</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-3xl font-bold text-slate-800 mb-6 text-center">圖片轉文字 (OCR)</h1>

    <!-- 上傳區域 -->
    <div id="dropArea" class="border-4 border-dashed border-slate-200 rounded-xl p-10 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-all group">
      <input id="fileInput" type="file" accept="image/*" class="hidden" />
      <div class="bg-indigo-100 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform">
        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
      </div>
      <p class="text-slate-600 font-medium" id="fileNameDisplay">點擊或拖曳圖片至此</p>
    </div>

    <!-- 設定與按鈕 -->
    <div class="mt-6 flex items-center justify-between">
      <label class="inline-flex items-center cursor-pointer">
        <input id="langToggle" type="checkbox" checked class="sr-only peer">
        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
        <span class="ml-3 text-sm font-medium text-slate-700">繁體中文 + 英文</span>
      </label>
      <button id="recognizeBtn" class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors" disabled>開始辨識</button>
    </div>

    <!-- 進度條 -->
    <div id="progressWrap" class="mt-6 hidden">
      <div class="flex justify-between mb-2">
        <span class="text-sm font-medium text-indigo-700" id="progressMsg">準備中...</span>
        <span class="text-sm font-medium text-indigo-700" id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5">
        <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- 結果區 -->
    <textarea id="resultBox" class="mt-6 w-full h-48 p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-slate-700 leading-relaxed" placeholder="辨識結果將顯示於此..."></textarea>
    
    <div class="mt-4 flex gap-3">
      <button id="copyBtn" class="flex-1 bg-emerald-500 text-white py-3 rounded-xl font-bold hover:bg-emerald-600 disabled:opacity-50 transition-colors">一鍵複製</button>
      <button id="clearBtn" class="px-6 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">清除</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const recognizeBtn = document.getElementById('recognizeBtn');
    const resultBox = document.getElementById('resultBox');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressMsg = document.getElementById('progressMsg');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const copyBtn = document.getElementById('copyBtn');

    let selectedFile = null;

    // 點擊上傳
    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    // 拖曳上傳
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('bg-indigo-50'); });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('bg-indigo-50'));
    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (file && file.type.startsWith('image/')) {
        selectedFile = file;
        fileNameDisplay.innerText = `已選擇：${file.name}`;
        recognizeBtn.disabled = false;
      }
    }


    // 監聽全域貼上事件
window.addEventListener('paste', (e) => {
  // 取得剪貼簿中的項目
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  
  for (let index in items) {
    const item = items[index];
    
    // 判斷該項目是否為圖片
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      
      // 呼叫原本處理檔案的函式 (handleFile)
      handleFile(blob);
      
      // 更新 UI 提示文字，讓使用者知道貼上成功
      fileNameDisplay.innerText = `已從剪貼簿讀取圖片：${blob.name || '貼上的圖片'}`;
      
      // 成功讀取後跳出迴圈
      break; 
    }
  }
});
    // OCR 核心邏輯
    recognizeBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      
      recognizeBtn.disabled = true;
      progressWrap.classList.remove('hidden');
      resultBox.value = '';
      
      const lang = document.getElementById('langToggle').checked ? 'chi_tra+eng' : 'eng';

      try {
        const { data: { text } } = await Tesseract.recognize(selectedFile, lang, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const p = Math.round(m.progress * 100);
              progressBar.style.width = p + '%';
              progressPercent.innerText = p + '%';
              progressMsg.innerText = '正在讀取圖片文字...';
            } else {
              progressMsg.innerText = '正在初始化引擎...';
            }
          }
        });
        resultBox.value = text;
        progressMsg.innerText = '辨識完成！';
      } catch (err) {
        alert('辨識失敗，請檢查網路連線');
        console.error(err);
      } finally {
        recognizeBtn.disabled = false;
      }
    });

    // 複製功能
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultBox.value);
      const originalText = copyBtn.innerText;
      copyBtn.innerText = '已複製！';
      setTimeout(() => copyBtn.innerText = originalText, 2000);
    });

    // 清除功能
    document.getElementById('clearBtn').addEventListener('click', () => {
      location.reload(); // 最簡單的清除方式
    });
  </script>
</body>
</html>
