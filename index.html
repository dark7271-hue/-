<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OCR 雲端辨識系統 Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind 深色模式配置
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #previewImg { max-height: 200px; object-fit: contain; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen py-10 px-4 transition-colors duration-300">
  <div class="w-full max-w-2xl mx-auto space-y-6">
    
    <!-- 頂部列：切換深色模式 -->
    <div class="flex justify-end">
      <button id="darkBtn" class="p-2 rounded-lg bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
        <span class="dark:hidden">🌙 深色模式</span>
        <span class="hidden dark:inline">☀️ 淺色模式</span>
      </button>
    </div>

    <!-- 主工具區 -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-100 dark:border-slate-700">
      <h1 class="text-3xl font-bold text-slate-800 dark:text-white mb-2 text-center">OCR 辨識與雲端翻譯</h1>
      <p class="text-center text-slate-400 dark:text-slate-500 text-sm mb-6">資料自動同步至 Google Sheets</p>

      <!-- 圖片預覽區域 (新增) -->
      <div id="previewContainer" class="hidden mb-6 flex flex-col items-center">
        <p class="text-xs font-bold text-slate-400 uppercase mb-2">圖片預覽</p>
        <img id="previewImg" class="rounded-lg border-2 border-indigo-100 dark:border-slate-600 shadow-sm" src="" />
      </div>

      <!-- 上傳區域 -->
      <div id="dropArea" class="border-4 border-dashed border-slate-200 dark:border-slate-700 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-400 dark:hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-slate-700/50 transition-all group">
        <input id="fileInput" type="file" accept="image/*" class="hidden" />
        <div class="bg-indigo-100 dark:bg-indigo-900/50 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform">
          <svg class="w-8 h-8 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        </div>
        <p class="text-slate-600 dark:text-slate-400 font-medium text-center" id="fileNameDisplay">點擊、拖曳或貼上圖片</p>
      </div>

      <!-- 設定區 -->
      <div class="mt-6 grid grid-cols-2 gap-4">
        <label class="flex items-center p-3 border dark:border-slate-700 rounded-xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          <input id="langToggle" type="checkbox" checked class="w-4 h-4 text-indigo-600">
          <span class="ml-3 text-sm font-medium text-slate-700 dark:text-slate-300">繁中 + 英文</span>
        </label>
        <label class="flex items-center p-3 border dark:border-slate-700 rounded-xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          <input id="translateToggle" type="checkbox" class="w-4 h-4 text-emerald-600">
          <span class="ml-3 text-sm font-medium text-slate-700 dark:text-slate-300">自動翻譯</span>
        </label>
      </div>

      <button id="recognizeBtn" class="mt-4 w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 disabled:opacity-50 transition-all shadow-lg" disabled>開始執行並同步雲端</button>

      <!-- 反饋提醒 (新增) -->
      <div id="syncFeedback" class="hidden mt-2 text-center text-emerald-500 font-bold text-sm animate-bounce">
        ✓ 已成功同步至 Google Sheets
      </div>

      <!-- 進度條 -->
      <div id="progressWrap" class="mt-6 hidden">
        <div class="flex justify-between mb-2 text-sm font-medium text-indigo-700 dark:text-indigo-400">
          <span id="progressMsg">準備中...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
          <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all" style="width: 0%"></div>
        </div>
      </div>

      <!-- 結果區 -->
      <div class="mt-6 space-y-4">
        <textarea id="resultBox" class="w-full h-32 p-3 border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="辨識結果..."></textarea>
        <div id="translateSection" class="hidden">
          <textarea id="translateBox" class="w-full h-32 p-3 border border-emerald-100 bg-emerald-50 dark:bg-emerald-900/20 dark:border-emerald-800 dark:text-emerald-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm" placeholder="翻譯結果..."></textarea>
        </div>
      </div>
      
      <div class="mt-6 flex gap-3">
        <button id="copyBtn" class="flex-1 bg-slate-800 dark:bg-slate-700 text-white py-3 rounded-xl font-bold hover:bg-slate-900 dark:hover:bg-slate-600 transition-all">複製結果</button>
        <button id="clearBtn" class="px-6 py-3 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-slate-600">清除</button>
      </div>
    </div>

    <!-- 歷史紀錄 -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-6 border border-slate-100 dark:border-slate-700">
      <h2 class="text-lg font-bold text-slate-700 dark:text-slate-300 mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        歷史紀錄 (最近 10 筆)
      </h2>
      <div id="historyList" class="space-y-3 max-h-80 overflow-y-auto pr-2"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjFBm0825t7GKTac1T-FFHBwgeVYZXc3-aUB2wV0N4ofq1OOG3Q9z63PKQQhHEgjOc/exec";
    
    const fileInput = document.getElementById('fileInput'), dropArea = document.getElementById('dropArea');
    const recognizeBtn = document.getElementById('recognizeBtn'), resultBox = document.getElementById('resultBox');
    const translateBox = document.getElementById('translateBox'), translateSection = document.getElementById('translateSection');
    const translateToggle = document.getElementById('translateToggle'), progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar'), progressPercent = document.getElementById('progressPercent');
    const progressMsg = document.getElementById('progressMsg'), fileNameDisplay = document.getElementById('fileNameDisplay');
    const historyList = document.getElementById('historyList');
    const previewContainer = document.getElementById('previewContainer'), previewImg = document.getElementById('previewImg');
    const syncFeedback = document.getElementById('syncFeedback');

    let selectedFile = null;

    // --- 1. 深色模式切換 ---
    document.getElementById('darkBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

    // --- 2. 圖片處理與預覽 ---
    function handleFile(file) {
      if (file && file.type.startsWith('image/')) {
        selectedFile = file;
        fileNameDisplay.innerText = `已選取：${file.name || '剪貼簿圖片'}`;
        recognizeBtn.disabled = false;
        
        // 顯示預覽圖
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          previewContainer.classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) if (item.kind === 'file' && item.type.startsWith('image/')) handleFile(item.getAsFile());
    });

    // --- 3. 雲端同步與紀錄 ---
    async function saveToHistory(original, translated) {
      // 本地紀錄
      let history = JSON.parse(localStorage.getItem('ocr_history') || '[]');
      history.unshift({ time: new Date().toLocaleString(), original, translated });
      localStorage.setItem('ocr_history', JSON.stringify(history.slice(0, 10)));
      renderHistory();

      // 同步到 Google Sheets
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({ original, translated: translated || "" })
        });
        // 顯示成功反饋 (新增)
        syncFeedback.classList.remove('hidden');
        setTimeout(() => syncFeedback.classList.add('hidden'), 3000);
      } catch (err) { console.error("Sync error", err); }
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('ocr_history') || '[]');
      historyList.innerHTML = history.map(item => `
        <div class="p-3 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-100 dark:border-slate-700 text-sm">
          <div class="text-[10px] text-slate-400 mb-1">${item.time}</div>
          <p class="text-slate-700 dark:text-slate-300 line-clamp-2"><strong>原文：</strong>${item.original}</p>
          ${item.translated ? `<p class="text-emerald-600 dark:text-emerald-400 line-clamp-2 italic"><strong>翻譯：</strong>${item.translated}</p>` : ''}
        </div>
      `).join('') || '<p class="text-center text-slate-400 py-4">尚無紀錄</p>';
    }

    // --- 4. 執行辨識 ---
    recognizeBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      recognizeBtn.disabled = true;
      progressWrap.classList.remove('hidden');
      resultBox.value = ''; translateBox.value = ''; translateSection.classList.add('hidden');
      
      const lang = document.getElementById('langToggle').checked ? 'chi_tra+eng' : 'eng';
      try {
        const { data: { text } } = await Tesseract.recognize(selectedFile, lang, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const p = Math.round(m.progress * 100);
              progressBar.style.width = p + '%';
              progressPercent.innerText = p + '%';
              progressMsg.innerText = '文字辨識中...';
            }
          }
        });

        // 簡單清洗辨識錯的 1 變 I (優化點)
        let finalOriginal = text.trim().replace(/([a-zA-Z])1([a-zA-Z])/g, '$1I$2');
        resultBox.value = finalOriginal;
        
        let tResult = null;
        if (translateToggle.checked && finalOriginal) {
          translateSection.classList.remove('hidden');
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${/[\u4e00-\u9fa5]/.test(finalOriginal) ? 'en' : 'zh-TW'}&dt=t&q=${encodeURIComponent(finalOriginal)}`);
          const data = await res.json();
          tResult = data[0].map(item => item[0]).join('');
          translateBox.value = tResult;
        }

        if (finalOriginal) await saveToHistory(finalOriginal, tResult);
        progressMsg.innerText = '完成！';
      } catch (err) { alert('辨識失敗'); } finally { recognizeBtn.disabled = false; }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const content = translateToggle.checked && translateBox.value ? `原文：\n${resultBox.value}\n\n翻譯：\n${translateBox.value}` : resultBox.value;
      navigator.clipboard.writeText(content);
    });

    document.getElementById('clearBtn').addEventListener('click', () => location.reload());
    renderHistory();
  </script>
</body>
</html>
